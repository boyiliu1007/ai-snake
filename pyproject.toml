[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snake"]

[project]
name = "ai-snake"
version = "0.1.0"
description = "Rainbow DQN agent for Snake on a 12x12 grid"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.2",
    "pygame>=2.6.1",
    "torch>=2.8.0",
    "gymnasium>=1.0.0",
    "tensorboard>=2.18.0",
]
